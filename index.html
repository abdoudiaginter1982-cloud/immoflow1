const seedProperties = [];
const seedTenants = [];

function formatFCFA(n) {
  return n.toLocaleString("fr-FR") + " FCFA";
}

function initials(name) {
  return (name || "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

function CollectionRing({ percent, size = 96, stroke = 9, color = GOLD, trackColor = "rgba(255,255,255,0.15)" }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const clamped = Math.max(0, Math.min(percent, 100));
  const offset = circumference - (clamped / 100) * circumference;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={trackColor} strokeWidth={stroke} />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={radius}
        fill="none"
        stroke={color}
        strokeWidth={stroke}
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset 0.6s ease" }}
      />
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" fill="white" fontSize={size * 0.22} fontWeight="700" fontFamily="'IBM Plex Mono', monospace">
        {Math.round(clamped)}%
      </text>
    </svg>

function Dashboard({ account, onLogout }) {
  const [properties, setProperties] = useState(seedProperties);
  const [tenants, setTenants] = useState(seedTenants);
  const [selectedPropertyId, setSelectedPropertyId] = useState("all");
  const [showAddProperty, setShowAddProperty] = useState(false);
  const [showAddTenant, setShowAddTenant] = useState(false);

  const handleAddTenantClick = () => setShowAddTenant(true);

  const findOrCreateProperty = (lieu, type) => {
    const trimmed = lieu.trim();
    const existing = properties.find((p) => p.name.trim().toLowerCase() === trimmed.toLowerCase());
    if (existing) return existing.id;
    const newProperty = { id: "p" + Date.now(), name: trimmed, address: trimmed, type };
    setProperties((prev) => [...prev, newProperty]);
    return newProperty.id;
  };

  const handleTenantAdd = (data) => {
    const { apartmentType, lieu, ...rest } = data;
    const propertyId = findOrCreateProperty(lieu, apartmentType);
    setTenants((prev) => [...prev, { ...rest, id: "t" + Date.now(), propertyId, payments: {} }]);
  };

  const togglePayment = (tenantId, monthIdx) => {
    setTenants((prev) => prev.map((t) => t.id === tenantId ? { ...t, payments: { ...t.payments, [monthIdx]: !t.payments[monthIdx] } } : t));
  };

  const visibleTenants = useMemo(() => selectedPropertyId === "all" ? tenants : tenants.filter((t) => t.propertyId === selectedPropertyId), [tenants, selectedPropertyId]);

  const stats = useMemo(() => {
    const collected = visibleTenants.reduce((sum, t) => sum + (t.payments[CURRENT_MONTH] ? t.rent : 0), 0);
    const expected = visibleTenants.reduce((sum, t) => sum + t.rent, 0);
    const late = visibleTenants.filter((t) => !t.payments[CURRENT_MONTH]).length;
    return { collected, expected, late, total: visibleTenants.length };
  }, [visibleTenants]);

  const trend = useMemo(() => {
    const start = Math.max(0, CURRENT_MONTH - 5);
    const expected = visibleTenants.reduce((sum, t) => sum + t.rent, 0);
    const months = [];
    for (let i = start; i <= CURRENT_MONTH; i++) {
      const collected = visibleTenants.reduce((sum, t) => sum + (t.payments[i] ? t.rent : 0), 0);
      months.push({ idx: i, label: MONTHS[i], rate: expected > 0 ? Math.round((collected / expected) * 100) : 0 });
    }
    return months;
  }, [visibleTenants]);

  const lateTenants = useMemo(() => visibleTenants.filter((t) => !t.payments[CURRENT_MONTH]), [visibleTenants]);

  const propertyName = (id) => properties.find((p) => p.id === id)?.name || "";

  return (
    <div className="min-h-screen" style={{ backgroundColor: "#F2F4F3", fontFamily: "'Inter', sans-serif" }}>
      <header style={{ backgroundColor: NAVY }} className="text-white">
        <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <img src={LOGO_SRC} alt="Immoflow — Gestion immobilière" className="h-12 w-auto object-contain" />
            <div>
              <div className="font-semibold text-lg leading-none" style={{ fontFamily: "'Roboto Slab', serif" }}>Immoflow</div>
              <div className="text-xs text-stone-300">{account.name}{account.plan ? ` · Plan ${account.plan}` : ""}</div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <span className="hidden sm:inline text-xs text-stone-300 px-2 py-1 rounded-sm border border-stone-500" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              {MONTHS[CURRENT_MONTH]} 2026
            </span>
            <button onClick={onLogout} className="text-xs flex items-center gap-1 text-stone-300 hover:text-white">
              <LogOut size={14} /> Déconnexion
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-6 py-8">
        <div className="rounded-xl p-6 mb-6 text-white relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${NAVY} 0%, #0a1226 100%)` }}>
          <div className="flex flex-col sm:flex-row items-center sm:items-stretch justify-between gap-6">
            <div>
              <div className="text-xs uppercase tracking-wide text-stone-300 mb-1" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {MONTHS[CURRENT_MONTH]} 2026 · Vue d'ensemble
              </div>
              <h2 className="text-2xl font-bold mb-1" style={{ fontFamily: "'Roboto Slab', serif" }}>
                {stats.total === 0
                  ? "Bienvenue sur votre espace"
                  : stats.late === 0
                  ? "Tout est à jour 🎉"
                  : `${stats.late} loyer${stats.late > 1 ? "s" : ""} en attente`}
              </h2>
              <p className="text-sm text-stone-300 max-w-sm">
                {stats.total === 0
                  ? "Ajoutez votre premier locataire pour voir vos statistiques ici."
                  : `${formatFCFA(stats.collected)} encaissés sur ${formatFCFA(stats.expected)} attendus.`}
              </p>
              <div className="flex gap-6 mt-5">
                <div>
                  <div className="text-2xl font-semibold" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{properties.length}</div>
                  <div className="text-xs text-stone-300 flex items-center gap-1"><Home size={12} /> Biens</div>
                </div>
                <div>
                  <div className="text-2xl font-semibold" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{stats.total}</div>
                  <div className="text-xs text-stone-300 flex items-center gap-1"><Users size={12} /> Locataires</div>
                </div>
                <div>
                  <div className="text-2xl font-semibold" style={{ fontFamily: "'IBM Plex Mono', monospace", color: stats.late > 0 ? "#ff9c7a" : "white" }}>{stats.late}</div>
                  <div className="text-xs text-stone-300 flex items-center gap-1"><AlertCircle size={12} /> Retards</div>
                </div>
              </div>
            </div>
            <div className="flex flex-col items-center justify-center">
              <CollectionRing percent={stats.expected > 0 ? (stats.collected / stats.expected) * 100 : 0} />
              <div className="text-xs text-stone-300 mt-2">Taux de recouvrement</div>
            </div>
          </div>
        </div>

        <div className="grid md:grid-cols-3 gap-4 mb-8">
          <div className="md:col-span-2 bg-white rounded-lg border border-stone-200 p-5">
            <div className="flex items-center gap-2 mb-4 text-sm font-medium" style={{ color: NAVY }}>
              <TrendingUp size={16} /> Tendance des encaissements
            </div>
            {stats.total === 0 ? (
              <p className="text-sm text-stone-400 py-10 text-center">Les données apparaîtront ici dès votre premier locataire.</p>
            ) : (
              <div className="flex items-end gap-3 h-36">
                {trend.map((m) => (
                  <div key={m.idx} className="flex-1 flex flex-col items-center gap-2 h-full">
                    <div className="w-full rounded-t-sm flex items-end flex-1" style={{ backgroundColor: "#F2F4F3" }}>
                      <div
                        className="w-full rounded-t-sm transition-all"
                        style={{
                          height: `${Math.max(Math.min(m.rate, 100), m.rate > 0 ? 4 : 0)}%`,
                          backgroundColor: m.idx === CURRENT_MONTH ? GOLD : m.rate >= 100 ? GREEN : m.rate === 0 ? "#e7e5e4" : RUST,
                        }}
                        title={`${m.label} : ${m.rate}%`}
                      />
                    </div>
                    <div className="text-[11px]" style={{ color: m.idx === CURRENT_MONTH ? NAVY : "#a8a29e", fontWeight: m.idx === CURRENT_MONTH ? 600 : 400 }}>
                      {m.label}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="bg-white rounded-lg border border-stone-200 p-5">
            <div className="flex items-center gap-2 mb-4 text-sm font-medium" style={{ color: NAVY }}>
              <Bell size={16} /> À relancer
            </div>
            {lateTenants.length === 0 ? (
              <div className="text-center py-8">
                <CheckCircle2 size={26} color={GREEN} className="mx-auto mb-2" />
                <p className="text-sm text-stone-400">{stats.total === 0 ? "Aucun locataire pour le moment" : "Aucun retard ce mois-ci"}</p>
              </div>
            ) : (
              <div className="space-y-3 max-h-40 overflow-y-auto pr-1">
                {lateTenants.slice(0, 6).map((t) => (
                  <div key={t.id} className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold text-white shrink-0" style={{ backgroundColor: RUST }}>
                      {initials(t.name)}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium truncate" style={{ color: NAVY }}>{t.name}</div>
                      <div className="text-xs text-stone-400 truncate">{propertyName(t.propertyId)}{t.unit ? ` · ${t.unit}` : ""}</div>
                    </div>
                    {t.phone && (
                      <a href={`tel:${t.phone}`} className="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: "#FAF9F7" }} title={`Appeler ${t.name}`}>
                        <Phone size={12} color={NAVY} />
                      </a>
                    )}
                  </div>
                ))}
                {lateTenants.length > 6 && <div className="text-xs text-stone-400 text-center pt-1">+{lateTenants.length - 6} autres</div>}
              </div>
            )}
          </div>
        </div>

        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setSelectedPropertyId("all")} className="px-3 py-1.5 rounded-full text-sm border transition"
              style={selectedPropertyId === "all" ? { backgroundColor: NAVY, color: "white", borderColor: NAVY } : { backgroundColor: "white", color: NAVY, borderColor: "#d6d3d1" }}>
              Tous les biens
            </button>
            {properties.map((p) => (
              <button key={p.id} onClick={() => setSelectedPropertyId(p.id)} className="px-3 py-1.5 rounded-full text-sm border transition flex items-center gap-1.5"
                style={selectedPropertyId === p.id ? { backgroundColor: NAVY, color: "white", borderColor: NAVY } : { backgroundColor: "white", color: NAVY, borderColor: "#d6d3d1" }}>
                <MapPin size={12} /> {p.name}
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={() => setShowAddProperty(true)} className="px-3 py-1.5 rounded text-sm font-medium border flex items-center gap-1.5" style={{ borderColor: NAVY, color: NAVY }}>
              <Plus size={14} /> Ajouter un bien
            </button>
            <button
              onClick={handleAddTenantClick}
              className="px-3 py-1.5 rounded text-sm font-medium flex items-center gap-1.5"
              style={{ backgroundColor: GOLD, color: NAVY }}
              title="Ajouter un locataire"
            >
              <Plus size={14} /> Ajouter un locataire
            </button>
          </div>
        </div>

        {properties.length === 0 ? (
          <div className="bg-white rounded-lg border border-stone-200 p-10 text-center">
            <Home size={30} className="mx-auto mb-3" color={NAVY} />
            <h3 className="font-semibold text-lg mb-2" style={{ color: NAVY }}>Votre espace est vide</h3>
            <p className="text-sm text-stone-500 max-w-md mx-auto mb-5">
              Ajoutez votre premier locataire pour commencer — le bien est créé automatiquement à partir du lieu que vous indiquez.
            </p>
            <div className="flex flex-col sm:flex-row gap-2 justify-center">
              <button onClick={() => setShowAddProperty(true)} className="px-4 py-2 rounded text-sm font-medium text-white" style={{ backgroundColor: NAVY }}>
                <Plus size={14} className="inline mr-1" /> Ajouter mon premier bien
              </button>
              <button onClick={handleAddTenantClick} className="px-4 py-2 rounded text-sm font-medium border" style={{ borderColor: NAVY, color: NAVY }}>
                <Plus size={14} className="inline mr-1" /> Ajouter un locataire
              </button>
            </div>
          </div>
        ) : (
        <div className="bg-white rounded-lg border border-stone-200 overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-stone-200" style={{ backgroundColor: "#FAF9F7" }}>
                  <th className="text-left py-3 px-4 font-medium text-stone-500 text-xs uppercase tracking-wide">Locataire</th>
                  {MONTHS.map((m, idx) => (
                    <th key={m} className="py-3 px-1 font-medium text-xs text-center" style={{ color: idx === CURRENT_MONTH ? GOLD : "#a8a29e", fontFamily: "'IBM Plex Mono', monospace" }}>{m}</th>
                  ))}
                  <th className="text-right py-3 px-4 font-medium text-stone-500 text-xs uppercase tracking-wide">Loyer</th>
                </tr>
              </thead>
              <tbody>
                {visibleTenants.length === 0 && (
                  <tr><td colSpan={14} className="text-center py-10 text-stone-400 text-sm">Aucun locataire pour ce bien. Ajoute-en un pour commencer le suivi.</td></tr>
                )}
                {visibleTenants.map((t) => (
                  <tr key={t.id} className="border-b border-stone-100 last:border-0">
                    <td className="py-3 px-4">
                      <div className="font-medium" style={{ color: NAVY }}>{t.name}</div>
                      <div className="text-xs text-stone-400 flex items-center gap-2 mt-0.5">
                        <span>{t.unit}</span>
                        {selectedPropertyId === "all" && <span className="text-stone-300">· {propertyName(t.propertyId)}</span>}
                      </div>
                      {t.phone && <div className="text-xs text-stone-400 flex items-center gap-1 mt-0.5"><Phone size={10} /> {t.phone}</div>}
                    </td>
                    {MONTHS.map((_, idx) => (
                      <td key={idx} className="py-3 px-1 text-center">
                        <button onClick={() => idx <= CURRENT_MONTH && togglePayment(t.id, idx)} className="mx-auto block" disabled={idx > CURRENT_MONTH}>
                          <StampCell paid={!!t.payments[idx]} isCurrent={idx === CURRENT_MONTH} isFuture={idx > CURRENT_MONTH} />
                        </button>
                      </td>
                    ))}
                    <td className="py-3 px-4 text-right font-medium" style={{ fontFamily: "'IBM Plex Mono', monospace", color: NAVY }}>{formatFCFA(t.rent)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        )}
        <p className="text-xs text-stone-400 mt-3">Les données affichées proviennent uniquement des informations saisies par l'utilisateur.</p>
      </main>

      {showAddProperty && <AddPropertyForm onAdd={(p) => setProperties((prev) => [...prev, p])} onClose={() => setShowAddProperty(false)} />}
      {showAddTenant && (
        <AddTenantForm
          properties={properties}
          defaultLieu={selectedPropertyId !== "all" ? propertyName(selectedPropertyId) : undefined}
          onAdd={handleTenantAdd}
          onClose={() => setShowAddTenant(false)}
        />
      )}
    </div>
  );
}

/* -------------------------------- App root ------------------------------- */

function App() {
  const [view, setView] = useState("landing");
  const [account, setAccount] = useState(null);
  const [selectedPlan, setSelectedPlan] = useState(null);

  const handleAuth = (data) => {
    setAccount({ name: data.name || "Mon compte" });
    setView(selectedPlan ? "checkout" : "dashboard");
  };

  const handlePlanSelect = (plan) => {
    setSelectedPlan(plan);
    setView("signup");
  };

  const handlePaymentComplete = (plan) => {
    setAccount((prev) => ({ ...(prev || {}), plan: plan.name }));
    setView("dashboard");
  };

  if (view === "dashboard" && account) {
    return <Dashboard account={account} onLogout={() => { setAccount(null); setSelectedPlan(null); setView("landing"); }} />;
  }
  if (view === "checkout" && selectedPlan) {
    return <Checkout plan={selectedPlan} onComplete={handlePaymentComplete} onBack={() => setView("landing")} />;
  }
  if (view === "login" || view === "signup") {
    return (
      <AuthPage
        mode={view}
        onSubmit={handleAuth}
        onSwitch={(m) => setView(m)}
        onBack={() => setView("landing")}
      />
    );
  }
  return <Landing onLogin={() => setView("login")} onSignup={() => setView("signup")} onSelectPlan={handlePlanSelect} />;
}

const root = document.getElementById("root");
if (root) ReactDOM.createRoot(root).render(<App />);
</script>
</body>
</html>
